<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#061f27"><title>BARAMEEL RUN — Scan QR</title><link rel="stylesheet" href="./styles.css?v=20260926-6"></head><body><main class="scan-stage"><img class="scan-art" src="./assets/screen05-scanner.webp" alt="Scan QR" fetchpriority="high" decoding="async"><a id="back" class="scan-back-hotspot" href="./screen04.html" aria-label="Back"></a><div class="camera-window" id="cameraWindow"><video id="video" playsinline webkit-playsinline muted autoplay></video><div id="scanLine"></div></div><button id="open" type="button" class="scan-open-hotspot" aria-label="Open camera"><span class="sr-only">Open camera and scan QR</span></button><canvas id="scanCanvas" width="640" height="480" hidden></canvas><div id="msg" class="scan-message" aria-live="polite"></div><div id="flash" class="success-flash"></div></main><script src="./app.js?v=20260926-6"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script><script>

const video=document.getElementById('video'),msg=document.getElementById('msg'),flash=document.getElementById('flash'),canvas=document.getElementById('scanCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),openBtn=document.getElementById('open'),cameraWindow=document.getElementById('cameraWindow'),scanLine=document.getElementById('scanLine');
let stream=null,detector=null,raf=0,locked=false,lastFrame=0,starting=false,scanMode='none',scanBusy=false,jsqrReady=false;
const status=t=>{msg.textContent=t||'';msg.classList.toggle('show',!!t)};
function stop(){cancelAnimationFrame(raf);raf=0;if(stream){stream.getTracks().forEach(t=>{try{t.stop()}catch(e){}});stream=null}try{video.pause()}catch(e){}video.srcObject=null;video.style.display='none';scanLine.classList.remove('on');detector=null;scanMode='none';starting=false;scanBusy=false;}
function secureOK(){return window.isSecureContext&&!!navigator.mediaDevices&&typeof navigator.mediaDevices.getUserMedia==='function'}
async function prepareDetector(){detector=null;scanMode='jsqr';if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code')){detector=new BarcodeDetector({formats:['qr_code']});scanMode='native';return}}catch(e){}}}
function resizeCanvas(){const w=video.videoWidth||1280,h=video.videoHeight||720;const maxW=960;const scale=Math.min(1,maxW/w);canvas.width=Math.max(320,Math.round(w*scale));canvas.height=Math.max(240,Math.round(h*scale));}
async function start(){
 if(starting||stream||locked)return;
 starting=true;try{BR.play('scan')}catch(e){}status('OPENING CAMERA…');
 if(!secureOK()){starting=false;status('CAMERA NEEDS HTTPS');try{BR.play('error')}catch(e){}return}
 let s=null;
 const attempts=[
   {audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},
   {audio:false,video:{facingMode:{ideal:'environment'}}},
   {audio:false,video:true}
 ];
 for(const c of attempts){try{s=await navigator.mediaDevices.getUserMedia(c);if(s)break}catch(e){}}
 if(!s){starting=false;status('CAMERA ACCESS DENIED OR UNAVAILABLE');try{BR.play('error')}catch(e){}return}
 stream=s;video.srcObject=stream;video.muted=true;video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');
 try{await video.play()}catch(e){try{video.muted=true;await video.play()}catch(x){}}
 video.style.display='block';resizeCanvas();await prepareDetector();starting=false;status('POINT CAMERA AT QR CODE');scanLine.classList.add('on');loop();
}
async function loop(){
 if(!stream||locked)return;
 const now=performance.now();if(now-lastFrame<110){raf=requestAnimationFrame(loop);return}lastFrame=now;
 try{
   if(video.readyState>=2){
     if(detector){const codes=await detector.detect(video);if(codes&&codes.length){await handle(codes[0].rawValue||'');return}}
     else if(typeof window.jsQR==='function'&&!scanBusy){scanBusy=true;resizeCanvas();ctx.drawImage(video,0,0,canvas.width,canvas.height);const img=ctx.getImageData(0,0,canvas.width,canvas.height);const code=window.jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});scanBusy=false;if(code&&code.data){await handle(code.data);return}}
   }
 }catch(e){scanBusy=false}
 raf=requestAnimationFrame(loop);
}
async function handle(raw){if(locked)return;const p=BR.parseQR(raw);if(!p){try{BR.play('error')}catch(e){}status('INVALID BARAMEEL QR');setTimeout(()=>status('POINT CAMERA AT QR CODE'),900);return}locked=true;stop();try{const cfg=await BR.fetchCollection(p.collection),im=cfg.images.find(x=>x.imageId===p.image),piece=im&&im.pieces.find(x=>Number(x.piece_number)===Number(p.piece));if(!im||!piece)throw Error('unknown');const fresh=BR.collect(p.collection,p.image,p.piece),points=fresh?Number(piece.points||0):0;if(points)BR.addPoints(points);const reward={collection:p.collection,image:p.image,piece:Number(p.piece),points,duplicate:!fresh,raw,at:Date.now(),imageNumber:im.imageNumber};BR.setLastReward(reward);localStorage.setItem('barameelLastQR',JSON.stringify(reward));if(fresh)BR.rewardTransition(reward);else BR.play('tap');flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');setTimeout(()=>BR.go(`screen06.html?collection=${encodeURIComponent(p.collection)}&image=${encodeURIComponent(p.image)}&piece=${p.piece}`),700)}catch(e){locked=false;status('QR NOT IN COLLECTION');try{BR.play('error')}catch(x){}}}
openBtn.addEventListener('click',e=>{e.preventDefault();start()});openBtn.addEventListener('pointerup',e=>{e.preventDefault();start()},{passive:false});document.getElementById('back').addEventListener('click',e=>{e.preventDefault();stop();BR.goAfter('screen04.html','back',420)});window.addEventListener('pagehide',stop);window.addEventListener('resize',()=>{if(stream)resizeCanvas()});
</script><script src="./register-sw.js?v=20260926-6"></script></body></html>
