<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BARAMEEL RUN — Scan QR</title><link rel="stylesheet" href="./styles.css"></head><body><main class="scan-stage"><img class="scan-art" src="./assets/screen05-scanner.webp" alt="Scan QR" fetchpriority="high" decoding="async"><button id="back" class="scan-back-hotspot" aria-label="Back"></button><div class="camera-window"><video id="video" playsinline muted></video><div id="scanLine"></div></div><button id="open" class="scan-open-hotspot" aria-label="Open camera"></button><div id="msg" class="scan-message"></div><div id="flash" class="success-flash"></div></main><script src="./app.js"></script><script>
const video=document.getElementById('video'),msg=document.getElementById('msg'),flash=document.getElementById('flash');let stream=null,detector=null,raf=0,locked=false;
const status=t=>{msg.textContent=t||'';msg.classList.toggle('show',!!t)};
function stop(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;video.style.display='none';document.getElementById('scanLine').classList.remove('on')}
async function start(){if(locked||stream)return;status('');if(!window.isSecureContext){status('CAMERA NEEDS HTTPS');BR.play('error');return}if(!('BarcodeDetector' in window)){status('QR SCANNER NEEDS CHROME ON ANDROID');BR.play('error');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}}});video.srcObject=stream;await video.play();video.style.display='block';document.getElementById('scanLine').classList.add('on');const f=await BarcodeDetector.getSupportedFormats();if(!f.includes('qr_code'))throw Error('no qr');detector=new BarcodeDetector({formats:['qr_code']});BR.play('scan');loop()}catch(e){stop();status(e.name==='NotAllowedError'?'ALLOW CAMERA ACCESS':'CAMERA COULD NOT OPEN');BR.play('error')}}
async function loop(){if(locked)return;try{const codes=await detector.detect(video);if(codes?.length){await handle(codes[0].rawValue||'');return}}catch(e){}raf=requestAnimationFrame(loop)}
async function handle(raw){if(locked)return;const p=BR.parseQR(raw);if(!p){BR.play('error');status('INVALID BARAMEEL QR');return}locked=true;stop();try{const cfg=await BR.fetchCollection(p.collection),im=cfg.images.find(x=>x.imageId===p.image),piece=im?.pieces.find(x=>Number(x.piece_number)===Number(p.piece));if(!im||!piece)throw Error('unknown');const fresh=BR.collect(p.collection,p.image,p.piece),points=fresh?Number(piece.points||0):0;if(points)BR.addPoints(points);const reward={collection:p.collection,image:p.image,piece:Number(p.piece),points,duplicate:!fresh,raw,at:Date.now(),imageNumber:im.imageNumber};BR.setLastReward(reward);localStorage.setItem('barameelLastQR',JSON.stringify(reward));if(fresh)BR.rewardTransition(reward);else BR.play('tap');flash.classList.add('on');setTimeout(()=>BR.go(`screen06.html?collection=${encodeURIComponent(p.collection)}&image=${encodeURIComponent(p.image)}&piece=${p.piece}`),700)}catch(e){locked=false;status('QR NOT IN COLLECTION');BR.play('error')}}
document.getElementById('open').onclick=start;document.getElementById('back').onclick=()=>{stop();BR.play('back');BR.go('screen04.html')};window.addEventListener('pagehide',stop);
</script><script src="./register-sw.js"></script></body></html>
