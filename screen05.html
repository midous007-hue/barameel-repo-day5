<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#061f27"><title>BARAMEEL RUN — Scan QR</title><link rel="stylesheet" href="./styles.css?v=20260926-5"></head><body><main class="scan-stage"><img class="scan-art" src="./assets/screen05-scanner.webp" alt="Scan QR" fetchpriority="high" decoding="async"><a id="back" class="scan-back-hotspot" href="./screen04.html" aria-label="Back"></a><div class="camera-window"><video id="video" playsinline webkit-playsinline muted></video><div id="scanLine"></div></div><button id="open" type="button" class="scan-open-hotspot" aria-label="Open camera"><span class="sr-only">Open camera and scan QR</span></button><label class="scan-native-camera" for="cameraFallback" aria-label="Open device camera"><span class="sr-only">Open device camera</span></label><input id="cameraFallback" type="file" accept="image/*" capture="environment"><canvas id="scanCanvas" width="640" height="480" hidden></canvas><div id="msg" class="scan-message" aria-live="polite"></div><div id="flash" class="success-flash"></div></main><script src="./app.js?v=20260926-5"></script><script>
const video=document.getElementById('video'),msg=document.getElementById('msg'),flash=document.getElementById('flash'),canvas=document.getElementById('scanCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),openBtn=document.getElementById('open'),fileInput=document.getElementById('cameraFallback');
let stream=null,detector=null,raf=0,locked=false,lastFrame=0,scanMode='none',starting=false;
const status=t=>{msg.textContent=t||'';msg.classList.toggle('show',!!t)};
function stop(){cancelAnimationFrame(raf);raf=0;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}try{video.pause()}catch(e){}video.srcObject=null;video.style.display='none';document.getElementById('scanLine').classList.remove('on');detector=null;scanMode='none';starting=false}
function supportedCamera(){return !!(navigator.mediaDevices&&typeof navigator.mediaDevices.getUserMedia==='function')}
async function prepareDetector(){detector=null;scanMode='none';if('BarcodeDetector' in window){try{const formats=await BarcodeDetector.getSupportedFormats();if(formats.includes('qr_code')){detector=new BarcodeDetector({formats:['qr_code']});scanMode='native';return}}catch(e){}}}
async function start(){
  if(starting||stream||locked)return;
  starting=true;try{BR.play('scan')}catch(e){}status('OPENING CAMERA…');
  if(!window.isSecureContext){starting=false;status('CAMERA NEEDS HTTPS');try{BR.play('error')}catch(e){};return}
  if(!supportedCamera()){starting=false;status('OPENING DEVICE CAMERA…');return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:'environment'},width:{ideal:1280},height:{ideal:720}}});
    video.srcObject=stream;video.muted=true;video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');await video.play();video.style.display='block';document.getElementById('scanLine').classList.add('on');await prepareDetector();starting=false;status(scanMode==='native'?'POINT YOUR CAMERA AT THE QR':'CAMERA ACTIVE — POINT AT THE QR');loop();
  }catch(e){
    const n=e&&e.name||'';stop();
    if(['NotAllowedError','SecurityError','NotFoundError','OverconstrainedError','NotReadableError','AbortError','TypeError'].includes(n)){status('OPENING DEVICE CAMERA…');try{fileInput.click()}catch(x){}return}
    status('CAMERA COULD NOT OPEN');try{BR.play('error')}catch(x){}
  }
}
async function loop(){if(!stream||locked)return;const now=performance.now();if(now-lastFrame<140){raf=requestAnimationFrame(loop);return}lastFrame=now;try{if(detector){const codes=await detector.detect(video);if(codes&&codes.length){await handle(codes[0].rawValue||'');return}}}catch(e){}raf=requestAnimationFrame(loop)}
async function decodeImageFile(file){if(!file)return;status('READING QR…');try{const img=new Image();img.onload=async()=>{let raw='';try{if('BarcodeDetector' in window){const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code')){const d=new BarcodeDetector({formats:['qr_code']});const codes=await d.detect(img);if(codes&&codes.length)raw=codes[0].rawValue||''}}}catch(e){}if(raw){await handle(raw);return}status('QR NOT FOUND IN PHOTO');try{BR.play('error')}catch(e){}};img.src=URL.createObjectURL(file)}catch(e){status('QR PHOTO COULD NOT BE READ');try{BR.play('error')}catch(x){}}}
async function handle(raw){if(locked)return;const p=BR.parseQR(raw);if(!p){try{BR.play('error')}catch(e){}status('INVALID BARAMEEL QR');return}locked=true;stop();try{const cfg=await BR.fetchCollection(p.collection),im=cfg.images.find(x=>x.imageId===p.image),piece=im&&im.pieces.find(x=>Number(x.piece_number)===Number(p.piece));if(!im||!piece)throw Error('unknown');const fresh=BR.collect(p.collection,p.image,p.piece),points=fresh?Number(piece.points||0):0;if(points)BR.addPoints(points);const reward={collection:p.collection,image:p.image,piece:Number(p.piece),points,duplicate:!fresh,raw,at:Date.now(),imageNumber:im.imageNumber};BR.setLastReward(reward);localStorage.setItem('barameelLastQR',JSON.stringify(reward));if(fresh)BR.rewardTransition(reward);else BR.play('tap');flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');setTimeout(()=>BR.go(`screen06.html?collection=${encodeURIComponent(p.collection)}&image=${encodeURIComponent(p.image)}&piece=${p.piece}`),700)}catch(e){locked=false;status('QR NOT IN COLLECTION');try{BR.play('error')}catch(x){}}}
openBtn.addEventListener('click',e=>{e.preventDefault();start()});openBtn.addEventListener('pointerup',e=>{e.preventDefault();start()},{passive:false});fileInput.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)decodeImageFile(f);e.target.value=''});document.getElementById('back').addEventListener('click',e=>{e.preventDefault();stop();BR.goAfter('screen04.html','back',420)});window.addEventListener('pagehide',stop);
</script></script><script src="./register-sw.js?v=20260926-5"></script></body></html>
