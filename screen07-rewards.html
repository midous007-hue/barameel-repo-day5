<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#061f27"><title>BARAMEEL RUN — My Rewards</title><link rel="stylesheet" href="./styles.css?v=20260927-11"></head><body><main class="rewards-stage rewards-artwork-stage"><img id="rewardsArt" class="rewards-art" src="./assets/screen07-rewards.webp" alt="My Rewards" fetchpriority="high" decoding="async"><div class="rewards-hotspots"><button id="back" class="rewards-back" type="button" aria-label="Back"></button><button id="scan" class="rewards-scan-hotspot" type="button" aria-label="Scan QR"></button><button id="settings" class="rewards-settings-hotspot" type="button" aria-label="Settings"></button></div>
<div id="rewardPoints" class="rewards-value points-value"></div><div id="rewardRank" class="rewards-value rank-value"></div><div id="rewardWeekly" class="rewards-value weekly-value"></div><div id="checkpointDots" class="checkpoint-dots" aria-hidden="true"></div><div id="rewardCheckpointCount" class="rewards-value checkpoint-value"></div><div class="rewards-row-hotspots" aria-hidden="true"><button class="rewards-row-hotspot points-row" type="button" data-target="points"></button><button class="rewards-row-hotspot rank-row" type="button" data-target="rank"></button><button class="rewards-row-hotspot weekly-row" type="button" data-target="weekly"></button><button class="rewards-row-hotspot checkpoint-row" type="button" data-target="checkpoints"></button></div>
</main><script src="./app.js?v=20260927-11"></script><script>
(()=>{
 const fmt=n=>Number(n||0).toLocaleString();
 const runner=BR.selected();
 document.getElementById('rewardPoints').textContent=fmt(BR.state.points);
 document.getElementById('rewardWeekly').textContent=fmt(BR.state.weeklyPoints);
 const cp=BR.checkpointCount();
 document.getElementById('rewardCheckpointCount').textContent=`${cp} / 90`;
 // Six visible milestone dots = 15 collected QR pieces per milestone.
 const dots=document.getElementById('checkpointDots');
 for(let i=0;i<6;i++){const d=document.createElement('span');d.className='checkpoint-dot'+(cp>=(i+1)*15?' on':'');dots.appendChild(d)}
 // Rank is intentionally shown only when the state already contains one; no invented ranking logic.
 if(BR.state.rank!=null)document.getElementById('rewardRank').textContent=String(BR.state.rank);
 document.getElementById('back').onclick=()=>BR.goAfter('screen06.html','back',180);
 document.getElementById('scan').onclick=()=>BR.goAfter('screen05.html','scan',220);
 document.getElementById('settings').onclick=()=>BR.play('tap');
 document.querySelectorAll('.rewards-row-hotspot').forEach(b=>b.onclick=()=>BR.play('tap'));
})();
</script><script src="./register-sw.js?v=20260927-11"></script></body></html>
