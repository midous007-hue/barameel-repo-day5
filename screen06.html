<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BARAMEEL RUN — ALEXANDRIA Collection</title><link rel="stylesheet" href="./styles.css?v=20260926-4"></head><body><main class="collection-stage"><img id="art" class="collection-art" src="./assets/screen06-puzzle.webp" alt="ALEXANDRIA Collection" fetchpriority="high" decoding="async"><button id="back" class="collection-back" aria-label="Back"></button><select id="select" class="collection-select" aria-label="Choose collection"><option value="collection01">ALEXANDRIA</option></select><div id="heroGrid" class="hero-grid"></div><div id="reward" class="reward-text"></div><div id="rewardSub" class="reward-sub"></div><button id="nice" class="nice-one" aria-label="Scan more"></button><div id="thumbs" class="collection-thumbs"></div><div id="completeFlash" class="complete-flash" aria-hidden="true"></div></main><script src="./app.js?v=20260926-4"></script><script>
(async()=>{
const params=new URLSearchParams(location.search),collection=params.get('collection')||'collection01',selected=params.get('image')||'image01';let cfg;try{cfg=await BR.fetchCollection(collection)}catch(e){return}
const art=document.getElementById('art'),hero=document.getElementById('heroGrid'),thumbs=document.getElementById('thumbs'),reward=document.getElementById('reward'),sub=document.getElementById('rewardSub');let current=cfg.images.find(x=>x.imageId===selected)||cfg.images[0];
function crop(cell,piece,master){const p=piece;cell.style.backgroundImage=`url("./${master}")`;cell.style.backgroundSize='300% 300%';cell.style.backgroundPosition=`${(p.column-1)*50}% ${(p.row-1)*50}%`;}
function renderHero(){hero.innerHTML='';for(let n=1;n<=9;n++){const p=current.pieces[n-1],cell=document.createElement('div');cell.className='hero-piece';if(BR.hasPiece(collection,current.imageId,n))crop(cell,p,current.masterFile);hero.appendChild(cell)}}
function thumbGrid(im){const wrap=document.createElement('button');wrap.type='button';wrap.className='collection-thumb';wrap.dataset.image=im.imageId;const grid=document.createElement('div');grid.className='thumb-grid';for(let n=1;n<=9;n++){const p=im.pieces[n-1],c=document.createElement('span');c.className='thumb-piece';if(BR.hasPiece(collection,im.imageId,n))crop(c,p,im.masterFile);grid.appendChild(c)}const count=document.createElement('span');count.className='thumb-count';count.textContent=`${BR.count(collection,im.imageId)}/9`;wrap.append(grid,count);if(!BR.count(collection,im.imageId))wrap.classList.add('locked');wrap.onclick=()=>{current=im;render()};return wrap}
function renderThumbs(){thumbs.innerHTML='';cfg.images.forEach(im=>thumbs.appendChild(thumbGrid(im)))}
function render(){renderHero();renderThumbs()}
function animateReward(){const r=BR.state.lastReward;if(!r||!r.points)return;sub.textContent='POINTS EARNED';const amount=Number(r.points)||0,start=performance.now(),duration=900;function tick(now){const t=Math.min(1,(now-start)/duration),e=1-Math.pow(1-t,3);reward.textContent='+'+Math.round(amount*e).toLocaleString()+' POINTS';reward.style.transform=`scale(${1+0.22*Math.sin(Math.min(1,t)*Math.PI)})`;if(t<1)requestAnimationFrame(tick);else{reward.textContent='+'+amount.toLocaleString()+' POINTS';setTimeout(()=>reward.style.transform='',250)}}requestAnimationFrame(tick)}
function completeEffect(){if(BR.count(collection,current.imageId)===9){document.getElementById('completeFlash').classList.remove('on');void document.body.offsetWidth;document.getElementById('completeFlash').classList.add('on')}}
render();animateReward();completeEffect();
document.getElementById('back').onclick=()=>BR.goAfter('screen05.html','back',180);document.getElementById('nice').onclick=()=>BR.goAfter('screen05.html','confirm',250);document.getElementById('select').onchange=e=>{const im=cfg.images.find(x=>x.imageId===e.target.value);if(im){current=im;render()}};
const tr=JSON.parse(localStorage.getItem('barameelRewardTransition')||'null');if(tr?.startedAt){const elapsed=(Date.now()-tr.startedAt)/1000;if(elapsed<1.8)BR.playRewardFrom(Math.max(0,elapsed))}
})();
</script><script src="./register-sw.js"></script></body></html>
